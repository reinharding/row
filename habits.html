<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Habits</title>
<script src="topbar.js" defer></script>

<style>
:root {
  --bg: #0a0a0b;
  --bg-card: #111113;
  --text-1: #ffffff;
  --text-2: rgba(255,255,255,0.6);
  --text-3: rgba(255,255,255,0.4);
  --text-4: rgba(255,255,255,0.25);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.14);
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;
  --info: #7DD3FC;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #14141a 0%, #0a0a0b 60%);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.shell { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

/* ----- Top day pill + header ----- */
.day-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase; margin-bottom: 10px;
  -webkit-tap-highlight-color: transparent;
}

.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-2); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.18s, color 0.18s;
}
.icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-1); }

/* ----- Eyebrow divider ----- */
.divider {
  display: flex; align-items: center; gap: 16px; margin-bottom: 14px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.10);
}
.divider span {
  font-size: 11px; letter-spacing: 0.22em; font-weight: 600;
  color: rgba(255,255,255,0.85);
}

/* ----- Card ----- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 20px 18px;
  margin-bottom: 14px;
}

/* ----- Habit rows ----- */
.habit-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.habit-row:last-child { border-bottom: none; }
.habit-top {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 8px; gap: 8px;
}
.habit-name { font-size: 15px; font-weight: 700; }
.habit-type-badge {
  font-size: 9px; font-weight: 800; letter-spacing: 0.10em;
  text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
  color: var(--text-3); border: 1px solid var(--border);
  margin-left: 6px;
}
.habit-value {
  font-size: 12px; color: var(--text-3);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.habit-top-right { display: flex; align-items: center; gap: 8px; }
.habit-delete-btn {
  background: transparent; border: none; color: var(--text-4);
  font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px;
  -webkit-tap-highlight-color: transparent;
}
.habit-delete-btn:hover { color: var(--bad); }

.habit-bar-track {
  position: relative; height: 10px; border-radius: 5px;
  background: rgba(255,255,255,0.04);
  overflow: hidden; margin-bottom: 12px;
}
.habit-bar-fill {
  position: absolute; top: 0; bottom: 0; left: 0;
  border-radius: 5px;
  transition: width 0.3s ease, background 0.3s ease;
}
.habit-bar-fill.met { background: var(--good); }
.habit-bar-fill.progress { background: var(--info); }
.habit-bar-fill.warn { background: var(--bad); }

.habit-checkin { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.habit-minus-btn {
  background: rgba(255,255,255,0.06);
  border: none; border-radius: 10px;
  color: var(--text-1);
  font-size: 18px; font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.habit-minus-btn:hover { background: rgba(255,255,255,0.10); }
.habit-minus-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.habit-plus-btn {
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b; border: none; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.habit-plus-btn:hover { background: #ffffff; }

/* ----- Shared 14-day history table ----- */
.hist-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.hist-legend-item { display: flex; align-items: center; gap: 6px; }
.hist-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.hist-legend-name { font-size: 12px; color: var(--text-2); }

.hist-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.hist-row:last-child { border-bottom: none; }
.hist-row-date {
  width: 62px; flex-shrink: 0;
  font-size: 11px; color: var(--text-3);
  font-family: var(--font-mono);
}
.hist-row-squares { display: flex; gap: 6px; flex-wrap: wrap; }
.hist-sq {
  width: 16px; height: 16px; border-radius: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
}

.empty-state {
  text-align: center; font-size: 13px; color: var(--text-3);
  padding: 20px 0; font-style: italic;
}

/* ----- Form fields (add habit) ----- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.field label {
  font-size: 11px; color: var(--text-3); font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.field input[type="number"], .field input[type="text"], .field select {
  background: rgba(0,0,0,0.28);
  border: 1px solid var(--border);
  color: var(--text-1);
  font-family: inherit; font-size: 16px;
  padding: 10px 12px; border-radius: 10px; outline: none;
  -moz-appearance: textfield;
}
.field input[type="number"]::-webkit-outer-spin-button,
.field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input:focus, .field select:focus {
  border-color: rgba(110,231,183,0.40);
  box-shadow: 0 0 0 2px rgba(110,231,183,0.10);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg {
  display: flex; gap: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 3px;
}
.seg button {
  flex: 1; padding: 9px; border: none; background: transparent;
  color: var(--text-3); border-radius: 7px;
  font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.seg button.active {
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b;
}

/* ----- Buttons ----- */
.btn-primary {
  width: 100%; padding: 13px;
  border: none;
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b; border-radius: 12px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgba(0,0,0,0.40);
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary {
  padding: 11px 16px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text-1); border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary:hover { background: rgba(255,255,255,0.10); }

@media (max-width: 480px) {
  .shell { padding: 16px 12px 60px; }
}
</style>
</head>
<body>

<div class="shell">

  <button class="day-pill" id="dayPill" type="button">
    <span id="dayPillLabel">—</span>
  </button>

  <div class="header">
    <h1 class="title">Habits</h1>
  </div>

  <div class="divider"><span>TODAY</span></div>

  <div class="card">
    <div id="habitsList"></div>
  </div>

  <div class="divider"><span>ADD A HABIT</span></div>

  <div class="card">
    <div class="field">
      <label>Name</label>
      <input type="text" id="newName" placeholder="e.g. Read, No soda">
    </div>
    <div class="field">
      <label>Type</label>
      <div class="seg" id="newType">
        <button data-t="build" class="active">Build</button>
        <button data-t="quit">Quit</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Target</label>
        <input type="number" id="newTarget" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>Unit (optional)</label>
        <input type="text" id="newUnit" placeholder="pages, cans…">
      </div>
    </div>
    <div class="field">
      <label>Weekly target (1-7)</label>
      <input type="number" id="newWeeklyTarget" min="1" max="7" step="1" placeholder="7">
    </div>
    <button class="btn-primary" id="addHabitBtn">Add habit</button>
  </div>

  <div class="divider"><span>LAST 14 DAYS</span></div>

  <div class="card">
    <div class="hist-legend" id="histLegend"></div>
    <div id="histTable"></div>
  </div>

  <div class="divider"><span>DATA</span></div>

  <div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-secondary" id="exportBtn">Export JSON</button>
      <button class="btn-secondary" id="importBtn">Import JSON</button>
      <button class="btn-secondary" id="resetBtn" style="color:var(--bad);border-color:rgba(255,138,138,0.3)">Reset all</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>

</div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);

  // ============================================================
  // STATE
  // ============================================================
  const LS_KEY = 'habit_tracker_v1';
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) {}
    return normalize({});
  }
  function normalize(s) {
    s = s || {};
    s.habits = Array.isArray(s.habits) ? s.habits : [];
    s.checkins = (s.checkins && typeof s.checkins === 'object') ? s.checkins : {};
    return s;
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }
  let state = loadState();

  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayKey() { return dateKey(new Date()); }

  function todayValue(habitId) {
    return (state.checkins[habitId] || {})[todayKey()] || 0;
  }
  function setTodayValue(habitId, value) {
    if (!state.checkins[habitId]) state.checkins[habitId] = {};
    state.checkins[habitId][todayKey()] = value;
    saveState();
  }

  // ============================================================
  // HABIT LOGIC — must match self-improvement-game's HabitTracker.tsx
  // ============================================================
  function habitMet(habit, value) {
    if (habit.type === 'quit') return value <= habit.target;
    return value >= habit.target;
  }
  function habitProgressPct(habit, value) {
    if (habit.target <= 0) return value > 0 ? 100 : 0;
    return Math.round(Math.min(value / habit.target, 1) * 100);
  }
  function habitBarClass(habit, value, met) {
    if (met) return 'met';
    return habit.type === 'quit' ? 'warn' : 'progress';
  }
  function habitValueLabel(habit, value) {
    const base = value + ' / ' + habit.target;
    return habit.unit ? (base + ' ' + habit.unit) : base;
  }

  // Identity color per habit, gated on habit.id so it stays stable across
  // reorder/delete/import — not derived from array position. Build habits
  // draw from a cool palette (blue/green/purple); quit habits draw from a
  // warm, alarming palette (red/orange — stop-sign association).
  const BUILD_PALETTE = ['#7DD3FC','#6ee7b7','#818cf8','#67e8f9','#93c5fd','#a7f3d0','#c4b5fd','#5eead4'];
  const QUIT_PALETTE  = ['#ff8a8a','#fb923c','#f87171','#f97316','#ef4444','#fdba74','#fca5a5','#fbbf24'];
  function hashStringToIndex(str, mod) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h) % mod;
  }
  function habitColor(habit) {
    const palette = habit.type === 'quit' ? QUIT_PALETTE : BUILD_PALETTE;
    return palette[hashStringToIndex(habit.id, palette.length)];
  }

  // ============================================================
  // RENDER
  // ============================================================
  function renderDayPill() {
    const d = new Date();
    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const mons = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    $('dayPillLabel').textContent = dows[d.getDay()] + ', ' + mons[d.getMonth()] + ' ' + d.getDate();
  }

  function renderHistory() {
    const legend = $('histLegend');
    const table = $('histTable');
    if (!state.habits.length) {
      legend.innerHTML = '';
      table.innerHTML = '<div class="empty-state">No habits yet — add one below.</div>';
      return;
    }
    legend.innerHTML = state.habits.map(habit =>
      '<div class="hist-legend-item">'
      + '<span class="hist-legend-dot" style="background:' + habitColor(habit) + '"></span>'
      + '<span class="hist-legend-name">' + escape(habit.name) + '</span>'
      + '</div>'
    ).join('');

    const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let rows = '';
    for (let i = 0; i <= 13; i++) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = dateKey(d);
      const label = dows[d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate();
      const squares = state.habits.map(habit => {
        const v = (state.checkins[habit.id] || {})[k] || 0;
        const met = habitMet(habit, v);
        const title = habit.name + ' — ' + k + ': ' + v + (habit.unit ? ' ' + habit.unit : '') + ' — ' + (met ? 'met' : 'not met');
        const style = met ? ' style="background:' + habitColor(habit) + ';border-color:' + habitColor(habit) + '"' : '';
        return '<div class="hist-sq" title="' + escape(title) + '"' + style + '></div>';
      }).join('');
      rows += '<div class="hist-row">'
        + '<span class="hist-row-date">' + label + '</span>'
        + '<div class="hist-row-squares">' + squares + '</div>'
        + '</div>';
    }
    table.innerHTML = rows;
  }

  function renderHabits() {
    const list = $('habitsList');
    if (!state.habits.length) {
      list.innerHTML = '<div class="empty-state">No habits yet — add one below.</div>';
      renderHistory();
      return;
    }
    list.innerHTML = state.habits.map(habit => {
      const value = todayValue(habit.id);
      const met = habitMet(habit, value);
      const pct = habitProgressPct(habit, value);
      const barCls = habitBarClass(habit, value, met);
      const barStyle = 'width:' + pct + '%' + (met ? ';background:' + habitColor(habit) : '');
      return '<div class="habit-row" data-id="' + habit.id + '">'
        + '<div class="habit-top">'
        +   '<span class="habit-name">' + escape(habit.name)
        +     '<span class="habit-type-badge">' + (habit.type === 'quit' ? 'Quit' : 'Build') + '</span>'
        +   '</span>'
        +   '<span class="habit-top-right">'
        +     '<span class="habit-value">' + escape(habitValueLabel(habit, value)) + '</span>'
        +     '<button class="habit-delete-btn" data-id="' + habit.id + '" data-name="' + escape(habit.name) + '" aria-label="Delete habit">×</button>'
        +   '</span>'
        + '</div>'
        + '<div class="habit-bar-track">'
        +   '<div class="habit-bar-fill ' + barCls + '" style="' + barStyle + '"></div>'
        + '</div>'
        + '<div class="habit-checkin">'
        +   '<button class="habit-minus-btn" data-id="' + habit.id + '"' + (value <= 0 ? ' disabled' : '') + ' aria-label="Remove one">−</button>'
        +   '<button class="habit-plus-btn" data-id="' + habit.id + '">+1</button>'
        + '</div>'
        + '</div>';
    }).join('');

    list.querySelectorAll('.habit-plus-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        setTodayValue(id, todayValue(id) + 1);
        renderHabits();
      });
    });
    list.querySelectorAll('.habit-delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        if (!confirm('Delete "' + btn.dataset.name + '"? This removes all its check-in history and cannot be undone.')) return;
        state.habits = state.habits.filter(h => h.id !== id);
        delete state.checkins[id];
        saveState();
        renderHabits();
      });
    });
    list.querySelectorAll('.habit-minus-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        setTodayValue(id, Math.max(0, todayValue(id) - 1));
        renderHabits();
      });
    });

    renderHistory();
  }

  function renderAll() { renderDayPill(); renderHabits(); }

  // ============================================================
  // ADD HABIT
  // ============================================================
  let newType = 'build';
  $('newType').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      newType = b.dataset.t;
      $('newType').querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  $('addHabitBtn').addEventListener('click', () => {
    const name = $('newName').value.trim();
    const target = Number($('newTarget').value);
    const unit = $('newUnit').value.trim();
    let weeklyTarget = Number($('newWeeklyTarget').value);
    if (!name) { alert('Enter a habit name.'); return; }
    if ($('newTarget').value === '' || isNaN(target)) { alert('Enter a numeric target.'); return; }
    if (!weeklyTarget || weeklyTarget < 1) weeklyTarget = 7;
    if (weeklyTarget > 7) weeklyTarget = 7;

    state.habits.push({
      id: crypto.randomUUID(),
      name: name,
      type: newType,
      target: target,
      unit: unit || null,
      weekly_target: weeklyTarget
    });
    saveState();

    $('newName').value = '';
    $('newTarget').value = '';
    $('newUnit').value = '';
    $('newWeeklyTarget').value = '';
    newType = 'build';
    $('newType').querySelectorAll('button').forEach(x => x.classList.remove('active'));
    $('newType').querySelector('[data-t="build"]').classList.add('active');

    renderHabits();
  });

  // ============================================================
  // EXPORT / IMPORT / RESET
  // ============================================================
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'habits-data-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(url);
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        if (!confirm('Replace ALL current habit data with the imported file?')) return;
        state = normalize(parsed);
        saveState(); renderAll();
      } catch (err) { alert('Import failed: ' + err.message); }
    };
    r.readAsText(f);
  });
  $('resetBtn').addEventListener('click', () => {
    if (!confirm('Wipe ALL habits and check-ins? This cannot be undone.')) return;
    localStorage.removeItem(LS_KEY);
    state = loadState();
    renderAll();
  });

  function escape(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // BOOT
  renderAll();
})();
</script>

</body>
</html>
